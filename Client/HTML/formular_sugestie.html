<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Formular</title>
    <link rel="stylesheet" href="../CSS/formular.css">
</head>
<body>
    <a href="sugestii.html" class="back-link"><button>Go back</button></a>
    <form id="form-sugestie">
        <h2>Alege o opțiune</h2>
        <select id="option">
            <option value="problema">Problema</option>
            <option value="initiativa">Initiativa</option>
            <option value="sugestii">Sugestie</option>
        </select>
        <input id="title" type="text" placeholder="Titlul" required>
        <textarea id="propunere" placeholder="Scrie aici..." required></textarea>
        <button type="submit">Trimite</button>
    </form>
    <div class="ai-response-div hidden">
        <div class="info-div">
            <h2>I'm in the middle!</h2>
            <p id="response-area">This box stays centered even if you scroll.</p>
            <button id="closeBtn" type="button">Mergi la postare</button>
        </div>
    </div>
    <script type="module" src="../JS/mutPagDeLaAI.js"></script>
    <script type="module" src="../JS/frontend.js"></script>
</body>
</html>
